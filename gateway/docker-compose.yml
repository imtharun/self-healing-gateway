services:
  gateway:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
    command: >
      sh -c "pip install -r gateway/requirements.txt &&
      uvicorn gateway.app:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    ports:
      - "8000:8000"

  dashboard:
    image: node:22-slim
    working_dir: /app/dashboard
    volumes:
      - ..:/app
    command: >
      sh -c "npm install &&
      npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - gateway
