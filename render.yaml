services:
  - type: web
    name: self-healing-gateway-api
    runtime: docker
    plan: free
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GATEWAY_AUDIT_DB
        value: /tmp/gateway/audit.db
      - key: GATEWAY_CORS_ORIGINS
        value: https://gateway.tharunprasath.com
      - key: PAYMENTS_UPSTREAM_URL
        sync: false
      - key: ORDERS_UPSTREAM_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
