services:
  - type: web
    name: self-healing-gateway-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GATEWAY_DB_SCHEMA
        value: self_healing_gateway
      - key: GATEWAY_CORS_ORIGINS
        value: https://gateway.tharunprasath.com
      - key: GEMINI_API_KEY
        sync: false
      - key: OPERATOR_PASSWORD_HASH
        sync: false
      - key: OPERATOR_SESSION_SECRET
        generateValue: true
      - key: GATEWAY_ALLOW_PRIVATE_UPSTREAMS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: OTEL_SERVICE_NAME
        value: self-healing-gateway
